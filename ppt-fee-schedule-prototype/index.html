<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT Fee Schedule — Prototype</title>
<style>
  :root {
    --ink: #1a1d23;
    --sub: #5b6270;
    --line: #dfe3e8;
    --bg: #f6f7f9;
    --card: #ffffff;
    --accent: #2f5fd8;
    --accent-dark: #1f45a8;
    --danger: #c53030;
    --good: #1c7c3f;
    --warn-bg: #fff8e6;
    --warn-border: #f0c674;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 4px; flex-wrap: wrap; gap: 8px;
  }
  header.top h1 { font-size: 19px; margin: 0; }
  .order-tag { font-size: 12px; color: var(--sub); }
  .proto-badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em;
    color: var(--accent-dark); background: #e8edfb; border: 1px solid #c7d3f5;
    padding: 2px 8px; border-radius: 100px; text-transform: uppercase;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-top: 16px;
  }
  .no-ppt-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: #fafbfc; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px;
  }
  .no-ppt-row label { font-size: 14px; font-weight: 500; cursor: pointer; }
  .question-row { flex-direction: column; align-items: flex-start; gap: 8px; }
  .question-label { font-size: 14px; font-weight: 500; }
  .radio-group { display: flex; gap: 20px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 400; cursor: pointer; }
  table.rows { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.rows th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
    color: var(--sub); font-weight: 600; padding: 0 6px 6px; border-bottom: 1px solid var(--line);
  }
  table.rows td { padding: 6px 6px; vertical-align: top; border-bottom: 1px solid #eef0f3; }
  table.rows select, table.rows input {
    width: 100%; padding: 6px 7px; font-size: 13px; border: 1px solid #c7cdd6; border-radius: 6px;
    background: #fff; color: var(--ink); min-width: 90px;
  }
  table.rows input[type="number"] { min-width: 80px; }
  table.rows select:focus, table.rows input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .cell-empty { color: #b7bcc4; font-size: 12px; padding-top: 8px; display: block; }
  .ro-value { display: block; padding: 6px 7px; font-size: 13px; color: var(--ink); }
  .rm-btn {
    background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px;
    padding: 4px 6px; border-radius: 6px; line-height: 1;
  }
  .rm-btn:hover { background: #fbe4e4; }
  .rm-btn:disabled { color: #c9ccd1; cursor: not-allowed; background: none; }
  .add-row-btn {
    margin-top: 10px; background: #fff; border: 1px dashed #9fb0e0; color: var(--accent-dark);
    font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 7px; cursor: pointer;
  }
  .add-row-btn:hover { background: #f0f4fd; }
  .field-error { color: var(--danger); font-size: 11px; margin-top: 2px; display: block; }
  .err select, .err input { border-color: var(--danger) !important; }

  .vendor-combo { position: relative; }
  .vendor-combo input.has-clear { padding-right: 26px; }
  .vendor-clear-btn {
    position: absolute; top: 50%; right: 4px; transform: translateY(-50%);
    background: none; border: none; color: var(--sub); font-size: 15px; line-height: 1;
    cursor: pointer; padding: 3px 5px; border-radius: 4px;
  }
  .vendor-clear-btn:hover { color: var(--danger); background: #fbe4e4; }
  .link-btn {
    background: none; border: none; color: var(--accent-dark); font-size: 11px; cursor: pointer;
    padding: 3px 0 0; text-decoration: underline;
  }
  .vendor-combo-list {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 20; margin: 2px 0 0; padding: 4px 0;
    list-style: none; background: #fff; border: 1px solid #c7cdd6; border-radius: 6px;
    box-shadow: 0 6px 16px rgba(20, 25, 40, 0.12); max-height: 190px; overflow-y: auto;
  }
  .vendor-combo-list.hidden { display: none; }
  .vendor-combo-list li { padding: 6px 10px; font-size: 13px; cursor: pointer; color: var(--ink); }
  .vendor-combo-list li:hover, .vendor-combo-list li.active { background: #f0f4fd; }
  .vendor-combo-list li.no-match { color: #b7bcc4; cursor: default; }
  .vendor-combo-list li.no-match:hover { background: none; }
  .vendor-combo-list li.other-option { border-top: 1px solid #eef0f3; color: var(--accent-dark); font-weight: 600; }

  .pw-gate {
    position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
    justify-content: center; z-index: 100;
  }
  .pw-gate.hidden { display: none; }
  .pw-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 28px 30px;
    width: 280px; box-shadow: 0 8px 24px rgba(20, 25, 40, 0.10); display: flex; flex-direction: column; gap: 10px;
  }
  .pw-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .pw-sub { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .pw-input {
    padding: 8px 10px; font-size: 14px; border: 1px solid #c7cdd6; border-radius: 6px; color: var(--ink);
  }
  .pw-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .pw-submit {
    background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 12px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .pw-submit:hover { background: var(--accent-dark); }
  .pw-error { color: var(--danger); font-size: 12px; min-height: 14px; }

  .preview-box {
    margin-top: 18px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .preview-box .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .03em; font-weight: 600;
    color: var(--sub); background: #f0f2f5; padding: 7px 12px; border-bottom: 1px solid var(--line);
  }
  .preview-box .text {
    padding: 12px 14px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px;
    background: #fbfcfd; word-break: break-word; min-height: 20px;
  }
  .preview-box .text.empty-warn { color: var(--warn-border); }

  .actions-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  button.primary {
    background: var(--accent); color: #fff; border: none; padding: 10px 20px; font-size: 14px;
    font-weight: 600; border-radius: 7px; cursor: pointer;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.secondary {
    background: #fff; color: var(--ink); border: 1px solid #c7cdd6; padding: 10px 18px; font-size: 14px;
    font-weight: 600; border-radius: 7px; cursor: pointer;
  }
  button.secondary:hover { background: #f0f2f5; }
  button.ghost {
    background: none; color: var(--sub); border: none; padding: 10px 12px; font-size: 14px;
    cursor: pointer; text-decoration: underline;
  }

  .review-row { display: flex; padding: 8px 0; border-bottom: 1px solid #eef0f3; font-size: 13px; gap: 14px; flex-wrap: wrap; }
  .review-row .idx { color: var(--sub); width: 20px; flex-shrink: 0; }
  .review-row .chip { background: #eef1f6; border-radius: 5px; padding: 2px 7px; font-size: 12px; }

  .help-box {
    background: #f0f4fd; border: 1px solid #c7d3f5; border-radius: 8px; padding: 16px 18px; font-size: 14px;
  }
  .help-box code { background: #e2e8fa; padding: 2px 6px; border-radius: 5px; font-size: 13px; }

  .confirm-box { text-align: center; padding: 40px 20px; }
  .confirm-box .check {
    width: 52px; height: 52px; border-radius: 50%; background: #e4f5ea; color: var(--good);
    display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 14px;
  }

  .assumptions {
    margin-top: 22px; font-size: 12px; color: var(--sub); border-top: 1px solid var(--line); padding-top: 14px;
  }
  .assumptions summary { cursor: pointer; font-weight: 600; color: var(--sub); }
  .assumptions ul { margin: 8px 0 0; padding-left: 18px; }
  .assumptions li { margin-bottom: 4px; }

  .step-indicator { display: flex; gap: 6px; font-size: 12px; color: var(--sub); margin-top: 6px; }
  .step-indicator span.on { color: var(--accent-dark); font-weight: 700; }
</style>
</head>
<body>
<div class="pw-gate" id="pwGate">
  <form class="pw-box" id="pwForm">
    <div class="pw-title">PPT Fee Schedule — Prototype</div>
    <div class="pw-sub">Enter password to continue</div>
    <input type="password" id="pwInput" class="pw-input" placeholder="Password" autocomplete="off" autofocus>
    <button type="submit" class="pw-submit">Unlock</button>
    <div class="pw-error" id="pwError"></div>
  </form>
</div>
<div class="wrap" id="app"></div>

<script>
/* ---------------------------------------------------------------------
   State
--------------------------------------------------------------------- */
const VENDOR_TYPES = ["Provider/Hospital", "General HIH", "HIH Carveout"];
const FEE_TYPES = ["Per Chart", "Per Page"];

function paymentTypeOptions(vendorType) {
  if (vendorType === "HIH Carveout") {
    return ["Pre+Post Pay", "Prepay Only", "Postpay Only", "Exclusion"];
  }
  return ["Pre+Post Pay", "Prepay Only", "Postpay Only"];
}

const CARVEOUT_VENDOR_NAMES = [
  "Advantmed", "Al Imaging", "AMS", "Better Instant", "BHS", "Care Consultants",
  "Chartpro", "Chartrequest", "CHM", "Copy Cat", "Copy Mate", "Copy Med",
  "Data Dimensions", "Datafied", "Datalink", "Diversified DMRS", "Document Access",
  "GRM", "Gulf Coast", "Healthcare Technologies", "Healthmark", "HIMQS", "IBS",
  "Iron Mtn", "Lexa", "Medical Docs", "Medical Records Now", "Medicopy", "Medrec",
  "Medrecs", "MMRA", "Morgan Records", "Mr P Copy", "MRO", "Noble", "Recordconnect",
  "Recordquest", "Scanstat", "Scanning Sherpas", "Sharecare", "Summit Retrieval",
  "Total Document Access", "Verisma", "VRC", "Westside Medical"
].sort((a, b) => a.localeCompare(b));

let rowSeq = 1;
function newRow() {
  return {
    id: rowSeq++,
    vendorType: "",
    vendorName: "",
    vendorNameOther: false,
    paymentType: "Pre+Post Pay",
    feeType: "Per Chart",
    amount: "",
    cnaFee: "",
    maxAmount: ""
  };
}

const state = {
  screen: "form",       // form | review | help | confirmation
  noPPT: false,
  approvalRequiredPerPage: false,
  rows: [newRow()],
  errors: {}            // rowId -> { field: message }
};

/* ---------------------------------------------------------------------
   Fee text preview formula
   (Reverse-engineered from sample outputs — see "Assumptions" panel)
--------------------------------------------------------------------- */
function fmtAmount(n) {
  const num = parseFloat(n);
  if (isNaN(num)) return "$0";
  const rounded = Math.round(num * 100) / 100;
  if (Math.abs(rounded - Math.round(rounded)) < 1e-9) return "$" + Math.round(rounded);
  return "$" + rounded.toFixed(2);
}

function isBlankOrZero(v) {
  return v === "" || v === null || v === undefined || isNaN(parseFloat(v)) || parseFloat(v) === 0;
}

function paymentLabel(pt) {
  if (pt === "Pre+Post Pay") return "Pre+Postpay";
  return pt;
}

function hasVendorNameField(vendorType) {
  return vendorType === "HIH Carveout";
}

function vendorLabel(row) {
  switch (row.vendorType) {
    case "Provider/Hospital": return "Prov";
    case "General HIH": return "HIH";
    case "HIH Carveout": return row.vendorName.trim() || "Unnamed Vendor";
    default: return row.vendorType;
  }
}

function isCarveoutName(row) { return hasVendorNameField(row.vendorType); }

// Ordering: Provider/Hospital first, General HIH second, HIH Carveout (alpha by name) last.
function vendorRank(vendorType) {
  if (vendorType === "Provider/Hospital") return 0;
  if (vendorType === "General HIH") return 1;
  return 2;
}

function buildFeeText() {
  if (state.noPPT) return "Approval required for all PPT fees";

  const rowsWithVendor = state.rows.filter(r => r.vendorType);
  const included = rowsWithVendor.filter(r => r.paymentType !== "Exclusion");
  const excludedRows = rowsWithVendor.filter(r => r.paymentType === "Exclusion");

  // Step A: group included rows into "cells" keyed by vendor identity + Fee Type. A cell
  // normally holds a single row (one Payment Type), but may hold exactly two: a Prepay Only
  // row paired with a Postpay Only row for the same vendor + Fee Type — the one sanctioned
  // way to have distinct prepay/postpay amounts, since it's rare and shouldn't require
  // re-entering everything twice.
  const cellMap = new Map();
  included.forEach(r => {
    const hasPrimary = !isBlankOrZero(r.amount);
    const hasCna = !isBlankOrZero(r.cnaFee);
    if (!hasPrimary && !hasCna) return; // nothing entered yet, skip from preview

    let amountStr = "";
    if (hasPrimary) {
      amountStr = fmtAmount(r.amount);
      if (r.feeType === "Per Page") {
        amountStr += "pp";
        if (!isBlankOrZero(r.maxAmount)) amountStr += ` (max ${fmtAmount(r.maxAmount)})`;
      }
    }
    const cnaStr = hasCna ? fmtAmount(r.cnaFee) : "";

    const cellKey = r.vendorType + "|" + (isCarveoutName(r) ? r.vendorName.trim() : "") + "||" + r.feeType;
    if (!cellMap.has(cellKey)) {
      cellMap.set(cellKey, { vendorType: r.vendorType, vendorName: r.vendorName, feeType: r.feeType, byType: {} });
    }
    cellMap.get(cellKey).byType[r.paymentType] = { amountStr, cnaStr };
  });

  // Step B: render each cell to one line. A Prepay Only + Postpay Only pair merges into a
  // single self-describing line rather than two separate segments.
  const globalModes = new Set();
  const renderedCells = Array.from(cellMap.values()).map(cell => {
    const types = Object.keys(cell.byType);
    let mode, label, amountStr, cnaStr;
    if (types.length === 2 && types.includes("Prepay Only") && types.includes("Postpay Only")) {
      const pre = cell.byType["Prepay Only"];
      const post = cell.byType["Postpay Only"];
      mode = "splitPair";
      label = "";
      const amtParts = [];
      if (pre.amountStr) amtParts.push(`Prepay ${pre.amountStr}`);
      if (post.amountStr) amtParts.push(`Postpay ${post.amountStr}`);
      amountStr = amtParts.join(", ");
      if (pre.cnaStr && post.cnaStr) cnaStr = `CNA Prepay ${pre.cnaStr}, Postpay ${post.cnaStr}`;
      else if (pre.cnaStr) cnaStr = `CNA Prepay Only ${pre.cnaStr}`;
      else if (post.cnaStr) cnaStr = `CNA Postpay Only ${post.cnaStr}`;
      else cnaStr = "";
    } else {
      const pt = types[0];
      const entry = cell.byType[pt];
      mode = pt;
      label = paymentLabel(pt);
      amountStr = entry.amountStr;
      cnaStr = entry.cnaStr ? `CNA ${entry.cnaStr}` : "";
    }
    if (amountStr) globalModes.add(mode);
    return { vendorType: cell.vendorType, vendorName: cell.vendorName, feeType: cell.feeType, mode, label, amountStr, cnaStr };
  });

  // Only when every line in the whole schedule shares one Payment Type mode (and that mode
  // isn't the Prepay/Postpay split pair, which has no single label) do we hoist it to a
  // shared prefix.
  const useSharedPrefix = globalModes.size === 1 && !globalModes.has("splitPair");

  // Merge cells back into per-vendor entries, keyed just by vendor identity, carrying up
  // to one Per Chart line and one Per Page line.
  const vendorMap = new Map();
  renderedCells.forEach(c => {
    const key = c.vendorType + "|" + (c.vendorType === "HIH Carveout" ? c.vendorName.trim() : "");
    if (!vendorMap.has(key)) vendorMap.set(key, { vendorType: c.vendorType, vendorName: c.vendorName, lines: {} });
    vendorMap.get(key).lines[c.feeType] = c;
  });

  const FEE_ORDER = ["Per Chart", "Per Page"];
  const vendorGroups = Array.from(vendorMap.values()).map(v => {
    const parts = [];
    FEE_ORDER.forEach(ft => {
      const line = v.lines[ft];
      if (!line) return;
      const segs = [];
      if (line.amountStr) segs.push(useSharedPrefix || !line.label ? line.amountStr : `${line.label} ${line.amountStr}`);
      if (line.cnaStr) segs.push(line.cnaStr);
      if (segs.length) parts.push(segs.join(", "));
    });
    return { vendorType: v.vendorType, vendorName: v.vendorName, feesString: parts.join(", ") };
  });

  // Step C: merge vendor groups that share an identical feesString
  const mergeMap = new Map();
  const mergeOrder = [];
  vendorGroups.forEach(g => {
    const key = g.feesString;
    if (!mergeMap.has(key)) {
      mergeMap.set(key, { feesString: g.feesString, labels: [] });
      mergeOrder.push(key);
    }
    mergeMap.get(key).labels.push({
      text: vendorLabel(g),
      isCarveout: g.vendorType === "HIH Carveout",
      rank: vendorRank(g.vendorType)
    });
  });

  let mergedGroups = mergeOrder.map(k => {
    const g = mergeMap.get(k);
    // Within a merged group: Provider first, General HIH second, then Carveouts alpha by name.
    const sortedLabels = g.labels.slice().sort((a, b) => a.rank - b.rank || a.text.localeCompare(b.text));
    let combined = "";
    sortedLabels.forEach((lbl, i) => {
      if (i === 0) { combined = lbl.text; return; }
      const prev = sortedLabels[i - 1];
      combined += (prev.isCarveout && lbl.isCarveout) ? ", " + lbl.text : "+" + lbl.text;
    });
    return {
      feesString: g.feesString,
      vendorLabel: combined,
      rank: Math.min(...sortedLabels.map(l => l.rank)),
      sortName: sortedLabels[0].text
    };
  });

  // Order: Provider/Hospital groups first, then General HIH groups, then Carveout groups alpha by name.
  mergedGroups = mergedGroups
    .map((g, i) => ({ ...g, i }))
    .sort((a, b) => a.rank - b.rank || a.sortName.localeCompare(b.sortName) || a.i - b.i);

  // Step D: lead with the shared Payment Type label once if every line in the schedule shares one
  let nonExclusionSegments = [];
  if (useSharedPrefix && mergedGroups.length) {
    const label = paymentLabel([...globalModes][0]);
    const groupStrs = mergedGroups.map(g => `${g.vendorLabel} ${g.feesString}`.trim());
    nonExclusionSegments.push([label, ...groupStrs].join(" | "));
  } else {
    mergedGroups.forEach(g => {
      nonExclusionSegments.push(`${g.vendorLabel} ${g.feesString}`.trim());
    });
  }

  // Step E: exclusions
  const excludedLabels = [];
  const seenExcl = new Set();
  excludedRows.forEach(r => {
    const lbl = vendorLabel(r);
    if (!seenExcl.has(lbl)) { seenExcl.add(lbl); excludedLabels.push(lbl); }
  });
  const exclusionSegment = excludedLabels.length ? `Not approved for ${excludedLabels.join(", ")}` : "";
  const perPageSegment = state.approvalRequiredPerPage ? "Approval required for all per page fees" : "";

  const all = [...nonExclusionSegments, exclusionSegment, perPageSegment].filter(Boolean);
  return all.join(" | ");
}

/* ---------------------------------------------------------------------
   Validation
--------------------------------------------------------------------- */
function validateRows() {
  const errors = {};
  state.rows.forEach(r => {
    const rowErrs = {};
    if (!r.vendorType) {
      rowErrs.vendorType = "Required";
    }
    if (hasVendorNameField(r.vendorType) && !r.vendorName.trim()) {
      rowErrs.vendorName = "Required";
    }
    if (r.paymentType !== "Exclusion" && (r.amount === "" || r.amount === null || isNaN(parseFloat(r.amount)))) {
      rowErrs.amount = "Required";
    }
    if (Object.keys(rowErrs).length) errors[r.id] = rowErrs;
  });
  state.errors = errors;
  return Object.keys(errors).length === 0;
}

/* ---------------------------------------------------------------------
   Rendering
--------------------------------------------------------------------- */
const app = document.getElementById("app");

function render() {
  if (state.screen === "form") renderForm();
  else if (state.screen === "review") renderReview();
  else if (state.screen === "help") renderHelp();
  else if (state.screen === "confirmation") renderConfirmation();
}

function optionsHtml(options, selected) {
  return options.map(o => `<option value="${o}" ${o === selected ? "selected" : ""}>${o}</option>`).join("");
}

/* ---------------------------------------------------------------------
   Vendor Name searchable combobox (HIH Carveout)
--------------------------------------------------------------------- */
function filterVendorNames(query) {
  const q = query.trim().toLowerCase();
  return q ? CARVEOUT_VENDOR_NAMES.filter(n => n.toLowerCase().includes(q)) : CARVEOUT_VENDOR_NAMES.slice();
}

function renderVendorComboList(rowId) {
  const listEl = document.querySelector(`.vendor-combo-list[data-row-id="${rowId}"]`);
  const inputEl = document.querySelector(`input[data-field="vendorNameSearch"][data-row-id="${rowId}"]`);
  if (!listEl || !inputEl) return;
  const matches = filterVendorNames(inputEl.value);
  const itemsHtml = matches.map(n => `<li data-value="${escapeAttr(n)}">${escapeHtml(n)}</li>`).join("");
  const noMatchHtml = matches.length === 0 ? `<li class="no-match">No matches</li>` : "";
  listEl.innerHTML = itemsHtml + noMatchHtml + `<li class="other-option" data-value="__other__">Other…</li>`;
  listEl.querySelectorAll("li[data-value]").forEach(li => {
    li.addEventListener("mousedown", (e) => {
      e.preventDefault();
      selectVendorName(rowId, li.dataset.value);
    });
  });
}

function openVendorCombo(rowId) {
  const listEl = document.querySelector(`.vendor-combo-list[data-row-id="${rowId}"]`);
  if (!listEl) return;
  renderVendorComboList(rowId);
  listEl.classList.remove("hidden");
}

function closeVendorCombo(rowId) {
  const listEl = document.querySelector(`.vendor-combo-list[data-row-id="${rowId}"]`);
  if (listEl) listEl.classList.add("hidden");
}

function moveVendorComboHighlight(rowId, delta) {
  const listEl = document.querySelector(`.vendor-combo-list[data-row-id="${rowId}"]`);
  if (!listEl) return;
  const items = Array.from(listEl.querySelectorAll("li[data-value]"));
  if (!items.length) return;
  const currentIndex = items.findIndex(li => li.classList.contains("active"));
  let nextIndex = currentIndex + delta;
  if (nextIndex < 0) nextIndex = items.length - 1;
  if (nextIndex >= items.length) nextIndex = 0;
  items.forEach(li => li.classList.remove("active"));
  items[nextIndex].classList.add("active");
  items[nextIndex].scrollIntoView({ block: "nearest" });
}

        <li>CNA Fee is its own column (rather than a Fee Type option) on every row when Payment Type isn't Exclusion — a single row captures both the primary fee and the CNA fee.</li>
        <li>Vendor Type is Provider/Hospital, General HIH, or HIH Carveout.</li>
        <li>Duplicate/conflict rules, checked live per row and again as a full-form gate on Review: (1) two rows can't share the same Vendor Type/Name, Payment Type, and Fee Type — exact duplicate. (2) For a given Vendor Type/Name + Fee Type, the only Payment Types allowed to coexist are Prepay Only + Postpay Only — any other pairing (e.g. Pre+Post Pay alongside Prepay Only) is blocked. (3) An Exclusion row for a given Vendor Name can't coexist with any other row for that same vendor.</li>

      state.rows.forEach(r => {

      });
    }
    render();
  }));

  const addBtn = document.getElementById("addRowBtn");
  if (addBtn) addBtn.addEventListener("click", () => {
    const row = newRow();
    state.rows.push(row);
    render();

  });

  document.querySelectorAll('[data-action="remove"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.rowId);
      state.rows = state.rows.filter(r => r.id !== id);
      delete state.errors[id];
      render();
    });
  });

  document.querySelectorAll("select[data-field]").forEach(sel => {
    sel.addEventListener("change", () => {
      const row = state.rows.find(r => r.id === Number(sel.dataset.rowId));
      const field = sel.dataset.field;
      row[field] = sel.value;
      if (field === "vendorType") {
        const allowed = paymentTypeOptions(row.vendorType);
        if (!allowed.includes(row.paymentType)) row.paymentType = "Pre+Post Pay";
        if (!hasVendorNameField(row.vendorType)) { row.vendorName = ""; row.vendorNameOther = false; }
      }
      if (field === "feeType" && row.feeType !== "Per Page") row.maxAmount = "";
      if (field === "paymentType" && row.paymentType === "Exclusion") { row.amount = ""; row.maxAmount = ""; row.cnaFee = ""; row.feeType = "Per Chart"; }
      render();
      // Duplicate/compat checks wait until Payment Type has actually been selected — running
      // them right on Vendor Type change would compare rows before the user has told us
      // enough to say whether they conflict (e.g. Payment Type still sitting at its default).
      if (field === "paymentType" || field === "feeType") checkDuplicateAndRemove(row.id);
    });
  });

  function refreshPreview() {
    const previewEl = document.getElementById("previewText");
    const text = buildFeeText();
    previewEl.textContent = text || "Enter fee details to preview…";
    previewEl.classList.toggle("empty-warn", !text);
  }

  document.querySelectorAll('input[data-field]:not([data-field="vendorNameSearch"]):not([data-field="vendorNameManual"])').forEach(inp => {
    inp.addEventListener("input", () => {
      const row = state.rows.find(r => r.id === Number(inp.dataset.rowId));
      row[inp.dataset.field] = inp.value;
      refreshPreview();
    });
  });

  document.querySelectorAll('input[data-field="vendorNameManual"]').forEach(inp => {
    inp.addEventListener("input", () => {
      const row = state.rows.find(r => r.id === Number(inp.dataset.rowId));
      row.vendorName = inp.value;
      refreshPreview();
    });
    inp.addEventListener("change", () => checkDuplicateAndRemove(Number(inp.dataset.rowId)));
  });

  document.querySelectorAll('[data-action="vendorNameUseList"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const row = state.rows.find(r => r.id === Number(btn.dataset.rowId));
      if (row) { row.vendorNameOther = false; row.vendorName = ""; }
      render();
    });
  });

  document.querySelectorAll('[data-action="vendorNameClear"]').forEach(btn => {
    btn.addEventListener("mousedown", (e) => e.preventDefault());
    btn.addEventListener("click", () => {
      const rowId = Number(btn.dataset.rowId);
      const row = state.rows.find(r => r.id === rowId);
      if (row) row.vendorName = "";
      render();
      const inp = document.querySelector(`input[data-field="vendorNameSearch"][data-row-id="${rowId}"]`);
      if (inp) inp.focus();
    });
  });

  document.querySelectorAll('input[data-field="vendorNameSearch"]').forEach(inp => {
    const rowId = Number(inp.dataset.rowId);
    inp.addEventListener("focus", () => openVendorCombo(rowId));
    inp.addEventListener("input", () => renderVendorComboList(rowId));
    inp.addEventListener("blur", () => {

        closeVendorCombo(rowId);
        const row = state.rows.find(r => r.id === rowId);
        if (row) inp.value = row.vendorName;
      }, 150);
    });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { inp.blur(); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        moveVendorComboHighlight(rowId, e.key === "ArrowDown" ? 1 : -1);

        if (!listEl) return;
        const active = listEl.querySelector("li.active[data-value]") || listEl.querySelector("li[data-value]");
        if (active) selectVendorName(rowId, active.dataset.value);

    if (!state.noPPT && hasDuplicateRows()) {

      return;
    }
    if (state.noPPT || validateRows()) {
      state.screen = "review";
      render();
    } else {
      render();
    }
  });
}

// Exact-duplicate key: same vendor identity, same Payment Type, same Fee Type.
function rowKey(r) {
  const vendorKey = r.vendorType + (hasVendorNameField(r.vendorType) ? "|" + r.vendorName.trim().toLowerCase() : "");
  const feeTypeKey = r.paymentType === "Exclusion" ? "" : r.feeType;
  return vendorKey + "||" + r.paymentType + "||" + feeTypeKey;
}

// Cell key: same vendor identity + Fee Type, ignoring Payment Type — used to check which
// Payment Types are allowed to coexist for that vendor/Fee Type combination.
function cellKeyOf(r) {
  const vendorKey = r.vendorType + (hasVendorNameField(r.vendorType) ? "|" + r.vendorName.trim().toLowerCase() : "");
  const feeTypeKey = r.paymentType === "Exclusion" ? "" : r.feeType;
  return vendorKey + "||" + feeTypeKey;
}

function vendorNameOf(r) {
  return hasVendorNameField(r.vendorType) ? r.vendorName.trim().toLowerCase() : "";
}

// A cell (one vendor + Fee Type) may carry one Payment Type, or exactly the Prepay Only +
// Postpay Only pair — any other combination of 2+ distinct Payment Types is disallowed.
function paymentTypesCompatible(types) {
  const s = new Set(types);
  if (s.size <= 1) return true;
  if (s.size === 2) return s.has("Prepay Only") && s.has("Postpay Only");
  return false;
}

function hasDuplicateRows() {
  const seenKeys = new Set();
  const cellGroups = new Map();
  const nameGroups = new Map();
  for (const r of state.rows) {
    if (!r.vendorType) continue; // no vendor picked yet — nothing to compare
    // HIH Carveout identity is the selected vendor name — until one is chosen, this row
    // isn't a real vendor yet and shouldn't be compared against anything.
    if (hasVendorNameField(r.vendorType) && !r.vendorName.trim()) continue;
    const key = rowKey(r);
    if (seenKeys.has(key)) return true;
    seenKeys.add(key);

    const cKey = cellKeyOf(r);
    const cArr = cellGroups.get(cKey) || [];
    cArr.push(r.paymentType);
    cellGroups.set(cKey, cArr);

    const name = vendorNameOf(r);
    if (name) {
      const nArr = nameGroups.get(name) || [];
      nArr.push(r.paymentType);
      nameGroups.set(name, nArr);
    }
  }
  for (const types of cellGroups.values()) {
    if (!paymentTypesCompatible(types)) return true;
  }
  for (const types of nameGroups.values()) {
    if (types.includes("Exclusion") && types.length > 1) return true;
  }
  return false;
}

// Returns "combo" (exact duplicate), "cell" (incompatible Payment Types on the same
// vendor + Fee Type), "name" (an Exclusion row conflicting with another row for the same
// vendor name), or null.
function findConflict(rowId) {
  const target = state.rows.find(r => r.id === rowId);
  if (!target || !target.vendorType) return null;
  // HIH Carveout identity is the selected vendor name — until one is chosen, there's
  // nothing yet to compare this row against.
  if (hasVendorNameField(target.vendorType) && !target.vendorName.trim()) return null;

  const comparable = (r) => r.id !== rowId && r.vendorType && !(hasVendorNameField(r.vendorType) && !r.vendorName.trim());

  const key = rowKey(target);
  for (const r of state.rows) {
    if (!comparable(r)) continue;
    if (rowKey(r) === key) return "combo";
  }

  const cKey = cellKeyOf(target);
  const cellTypes = state.rows
    .filter(r => comparable(r) && cellKeyOf(r) === cKey)
    .map(r => r.paymentType)
    .concat(target.paymentType);
  if (!paymentTypesCompatible(cellTypes)) return "cell";

  const name = vendorNameOf(target);
  if (name) {
    const nameTypes = state.rows
      .filter(r => comparable(r) && vendorNameOf(r) === name)
      .map(r => r.paymentType)
      .concat(target.paymentType);
    if (nameTypes.includes("Exclusion") && nameTypes.length > 1) return "name";
  }

  return null;
}

function checkDuplicateAndRemove(rowId) {
  if (state.noPPT) return;
  const conflict = findConflict(rowId);
  if (!conflict) return;
  if (conflict === "combo") {
    alert("Duplicate row: another row already has this Vendor Type/Name, Payment Type, and Fee Type. This row will be removed.");
  } else if (conflict === "cell") {
    alert("Incompatible Payment Type: for this Vendor Type/Name and Fee Type, only a Prepay Only + Postpay Only pair may coexist — not this combination. This row will be removed.");
  } else {
    alert("Duplicate vendor name: an Exclusion row for this Vendor Name can't coexist with another row. This row will be removed.");
  }
  state.rows = state.rows.filter(r => r.id !== rowId);
  delete state.errors[rowId];
  render();
}

function reviewRowHtml(r) {
  const showVendorName = hasVendorNameField(r.vendorType);
  const showFeeType = r.paymentType !== "Exclusion";
  const showAmount = r.paymentType !== "Exclusion";
  const showMax = r.feeType === "Per Page" && r.paymentType !== "Exclusion";
  const showCna = r.paymentType !== "Exclusion";

  const cell = (shown, value) => shown
    ? `<span class="ro-value">${value !== "" && value !== null && value !== undefined ? escapeHtml(value) : "—"}</span>`
    : `<span class="cell-empty">—</span>`;

  return `
    <tr>
      <td></td>
      <td>${cell(true, r.vendorType)}</td>
      <td>${cell(true, r.paymentType)}</td>
      <td>${cell(showVendorName, r.vendorName)}</td>
      <td>${cell(showCna, r.cnaFee)}</td>
      <td>${cell(showFeeType, r.feeType)}</td>
      <td>${cell(showAmount, r.amount)}</td>
      <td>${cell(showMax, r.maxAmount)}</td>
    </tr>
  `;
}

      <div class="preview-box" style="text-align:left;max-width:600px;margin:0 auto 18px;">
        <div class="label">Submitted Fee Text</div>
        <div class="text">${escapeHtml(buildFeeText())}</div>
      </div>
      <button class="secondary" id="startOverBtn" type="button">Start a new fee schedule</button>
    </div>
  `;

  document.getElementById("startOverBtn").addEventListener("click", () => {
    state.noPPT = false;
    state.rows = [newRow()];
    state.errors = {};
    state.screen = "form";
    render();
  });
}

/* ---------------------------------------------------------------------
   Utils
--------------------------------------------------------------------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

/* ---------------------------------------------------------------------
   Password gate (prototype access control only — not real security;
   password is visible in this file's source)
--------------------------------------------------------------------- */
const PROTO_PASSWORD = "mango";
const PROTO_AUTH_KEY = "pptFeeProtoAuth";

function initPasswordGate() {
  const gate = document.getElementById("pwGate");
  if (sessionStorage.getItem(PROTO_AUTH_KEY) === "1") {
    gate.classList.add("hidden");
    return;
  }
  const form = document.getElementById("pwForm");
  const input = document.getElementById("pwInput");
  const error = document.getElementById("pwError");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (input.value === PROTO_PASSWORD) {
      sessionStorage.setItem(PROTO_AUTH_KEY, "1");
      gate.classList.add("hidden");
    } else {
      error.textContent = "Incorrect password.";
      input.value = "";
      input.focus();
    }
  });
}

initPasswordGate();
render();
</script>
